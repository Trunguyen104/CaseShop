name: CI/CD Pipeline - CaseShop Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Build & Test Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (for Tailwind CSS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'CaseShop.Web/package-lock.json'

      - name: Install NPM dependencies & Build Tailwind CSS
        run: |
          cd CaseShop.Web
          npm ci
          npm run build:css
          cd ..

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET Solution (Release)
        run: dotnet build --no-restore -c Release /p:SkipTailwindBuild=true

      - name: Run .NET Tests
        run: dotnet test --no-build -c Release

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          timeout: 180s
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo "[1/5] Bắt đầu tự động cập nhật Production CaseShop..."
            echo "=========================================================="

            # 1. Điều hướng vào thư mục dự án trên EC2
            cd ~/CaseShop

            # 2. Đồng bộ mã nguồn mới nhất từ remote main (an toàn, không xung đột git)
            echo "[2/5] Kéo mã nguồn mới nhất từ GitHub (branch: main)..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Build lại Docker image và cập nhật container chạy ngầm
            echo "[3/5] Rebuild container và cập nhật phiên bản mới..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

            # 4. Thu dọn image cũ không dùng để tiết kiệm dung lượng ổ cứng EC2
            echo "[4/5] Dọn dẹp Docker images không sử dụng..."
            docker image prune -f

            # 5. Kiểm tra kết quả trạng thái containers
            echo "[5/5] Trạng thái các dịch vụ hiện tại:"
            docker compose -f docker-compose.prod.yml ps

            echo "=========================================================="
            echo "[THÀNH CÔNG] Đã cập nhật phiên bản mới nhất lên server!"
            echo "=========================================================="
